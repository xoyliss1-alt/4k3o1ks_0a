services:
  - type: web
    name: woodoogifi-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: woodoogifi-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false

databases:
  - name: woodoogifi-db
    databaseName: woodoogifi
    user: woodoogifi
